services:
  - type: web
    name: paypulse-ai-demo
    runtime: python
    plan: free
    buildCommand: cd frontend && npm ci && VITE_PAYPULSE_API_KEY="$PAYPULSE_API_KEY" npm run build && cd .. && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.0
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPULSE_API_KEY
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_WEBHOOK_URL
        value: https://paypulse-ai-demo.onrender.com/api/webhooks/paypal
      - key: FRONTEND_ORIGIN
        value: https://paypulse-ai-demo.onrender.com
      - key: MAX_REQUEST_BYTES
        value: "65536"
      - key: MERGE_LIVE_INVOICES
        value: "false"
